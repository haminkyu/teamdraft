name: 앱 만들기

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  apk:
    name: 안드로이드 APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: 웹앱 파일을 APK에 넣기
        run: |
          rm -rf android/app/src/main/assets/web
          mkdir -p android/app/src/main/assets
          cp -r web android/app/src/main/assets/web

      - name: APK 빌드
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: 파일 이름 정리
        run: cp android/app/build/outputs/apk/release/app-release.apk teamdraft.apk

      - uses: actions/upload-artifact@v4
        with:
          name: teamdraft-apk
          path: teamdraft.apk

      - name: 릴리스에 올리기
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: 팀짜기 v1.0.${{ github.run_number }}
          body: |
            안드로이드 설치 파일입니다. 아래 teamdraft.apk를 눌러 받은 뒤 설치하세요.
            (처음 설치할 때 '출처를 알 수 없는 앱 허용'이 필요할 수 있어요)
          files: teamdraft.apk
          make_latest: true

  web:
    name: 웹앱 (GitHub Pages)
    runs-on: ubuntu-latest
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deploy
        uses: actions/deploy-pages@v4
